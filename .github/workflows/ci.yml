name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: v8.30.1
  TRUFFLEHOG_VERSION: v3.95.5

jobs:
  validate:
    name: Test, Security, and Quality Gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install trufflehog
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trufflehog"
          curl -fsSL \
            -o "$RUNNER_TEMP/trufflehog/trufflehog.tar.gz" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/trufflehog/trufflehog.tar.gz" -C "$RUNNER_TEMP/trufflehog"
          chmod +x "$RUNNER_TEMP/trufflehog/trufflehog"
          echo "$RUNNER_TEMP/trufflehog" >> "$GITHUB_PATH"

      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage gate (≥60%)
        run: |
          pct=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${pct}%"
          awk -v pct="$pct" 'BEGIN { if (pct+0 < 60) { print "FAIL: coverage " pct "% is below 60% threshold"; exit 1 } }'

      - name: govulncheck
        run: govulncheck ./...

      - name: gitleaks detect
        run: gitleaks detect --no-banner --redact

      - name: gitleaks git history
        run: gitleaks git --no-banner --redact --log-opts="--all" .

      - name: trufflehog git history
        run: trufflehog git file://. --results=verified,unknown --fail

  build:
    name: Build linux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build runtime binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/mcp-runtime-linux-${{ matrix.arch }}" ./cmd/mcp-runtime

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: mcp-runtime-linux-${{ matrix.arch }}
          path: dist/mcp-runtime-linux-${{ matrix.arch }}
          if-no-files-found: error
