name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Test with coverage
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage gate (≥60%)
        run: |
          pct=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${pct}%"
          awk -v pct="$pct" 'BEGIN { if (pct+0 < 60) { print "FAIL: coverage " pct "% is below 60% threshold"; exit 1 } }'

      - name: Test (race detector)
        run: go test -race ./...

      - name: Build mcp-runtime
        run: go build ./cmd/mcp-runtime

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
